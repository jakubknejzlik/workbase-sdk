name: SDK CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '25.8.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install verified gitleaks 8.24.3
        run: |
          tools="$(mktemp -d)"
          curl -fsSL --retry 5 --retry-all-errors https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o "$tools/gitleaks.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $tools/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tools/gitleaks.tar.gz" -C "$tools" gitleaks
          echo "$tools" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:ci-invariants
        env:
          WORKBASE_PRIVATE_TERMS: ${{ secrets.WORKBASE_PRIVATE_TERMS }}
      - run: bun run test
        env:
          WORKBASE_PRIVATE_TERMS: ${{ secrets.WORKBASE_PRIVATE_TERMS }}
      - run: bun run test:mcp
      - run: bash scripts/sdk-pack.sh
        env:
          WORKBASE_PRIVATE_TERMS: ${{ secrets.WORKBASE_PRIVATE_TERMS }}
      - run: bun scripts/check-sdk-boundary.ts
        env:
          WORKBASE_PRIVATE_TERMS: ${{ secrets.WORKBASE_PRIVATE_TERMS }}
      - run: bun scripts/scan-sdk-public.ts
        env:
          WORKBASE_PRIVATE_TERMS: ${{ secrets.WORKBASE_PRIVATE_TERMS }}
