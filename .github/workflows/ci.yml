name: SDK CI
on:
  # Full CI runs automatically only for PRs into main (e.g. the integration PR).
  # PRs into integration/* branches use targeted local checks; run this
  # workflow manually (workflow_dispatch) on any ref when a full run is needed.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    # Green run 45249397779 took 77.8 min; cancelled runs 45268109310/45268054669
    # were ×1.42–1.61 slower with no test failures. 150 min covers ~×1.9.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '25.8.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install verified gitleaks 8.24.3
        run: |
          tools="$(mktemp -d)"
          curl -fsSL --retry 5 --retry-all-errors https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o "$tools/gitleaks.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $tools/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tools/gitleaks.tar.gz" -C "$tools" gitleaks
          echo "$tools" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun x --no-install playwright install --with-deps chromium
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:ci-invariants
        env:
          WORKBASE_PRIVATE_TERMS: ${{ secrets.WORKBASE_PRIVATE_TERMS }}
      - run: bun run test
        env:
          WORKBASE_PRIVATE_TERMS: ${{ secrets.WORKBASE_PRIVATE_TERMS }}
      - name: List v2 runtime diagnostics
        run: |
          fc-list | sort
          node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch(); console.log("Chromium " + browser.version()); await browser.close()'
      - name: List v2 acceptance (including #233 regressions)
        run: bun run console:build && bun run test:list-v2-acceptance
        env:
          LIST_V2_OUTPUT: ${{ runner.temp }}/list-v2-acceptance
          WORKBASE_PRIVATE_TERMS: ${{ secrets.WORKBASE_PRIVATE_TERMS }}
      - name: Upload List v2 acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: list-v2-acceptance-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/list-v2-acceptance/test-results/
            ${{ runner.temp }}/list-v2-acceptance/playwright-report/
            ${{ runner.temp }}/list-v2-acceptance/results.json
            ${{ runner.temp }}/list-v2-acceptance/manifest.json
          retention-days: 14
          if-no-files-found: warn
      - run: bun run test:mcp
      - run: bash scripts/sdk-pack.sh
        env:
          WORKBASE_PRIVATE_TERMS: ${{ secrets.WORKBASE_PRIVATE_TERMS }}
      - run: bun scripts/check-sdk-boundary.ts
        env:
          WORKBASE_PRIVATE_TERMS: ${{ secrets.WORKBASE_PRIVATE_TERMS }}
      - run: bun scripts/scan-sdk-public.ts
        env:
          WORKBASE_PRIVATE_TERMS: ${{ secrets.WORKBASE_PRIVATE_TERMS }}
